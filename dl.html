<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ file_name }} · {{ site_name|default('CineHubPro') }}</title><style>
body{margin:0;background:#090b12;color:#f6f7fb;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}.card{max-width:650px;width:100%;background:#121827;border:1px solid #ffffff18;border-radius:20px;padding:26px;box-sizing:border-box}.brand{font-weight:900;letter-spacing:.08em}.brand span{color:#929aff}h1{overflow-wrap:anywhere;font-size:clamp(1.3rem,4vw,2rem)}p{color:#9aa7ba}.btn{display:inline-block;background:linear-gradient(135deg,#727cff,#a060e8);color:white;padding:13px 20px;border-radius:12px;text-decoration:none;font-weight:700}.ad{margin:18px 0;text-align:center}.ad:empty{display:none}</style></head><body><section class="card"><div class="brand">CINEHUB<span>PRO</span></div><div class="ad">{{ ad_html|safe }}</div><h1>{{ file_name }}</h1><p>File size: {{ file_size }}</p><a class="btn" href="{{ file_url }}">Download file</a><div class="ad">{{ ad_html|safe }}</div></section></body></html>
